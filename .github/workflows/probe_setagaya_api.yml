name: Probe Setagaya AED API

on:
  push:
    paths:
      - "scripts/probe_setagaya_api.py"
      - ".github/workflows/probe_setagaya_api.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/probe_setagaya_api.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import_reports/20260912_setagaya_api_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe Setagaya AED Hub APIs"
          git fetch origin main
          git rebase origin/main
          git push
