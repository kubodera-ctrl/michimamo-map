name: AED dev16 Chiba official pages

on:
  push:
    branches: [main]
    paths:
      - scripts/scrape_chiba_aed_official_pages.py
      - .github/workflows/aed_dev16_chiba_pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Scrape official AED pages
        run: python scripts/scrape_chiba_aed_official_pages.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev16_chiba_pages
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Capture official Chiba AED page data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
