name: Discover Remaining Tokyo AED Sources

on:
  push:
    paths:
      - "scripts/discover_tokyo_aed_sources.py"
      - ".github/workflows/discover_tokyo_aed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Discover sources
        run: python scripts/discover_tokyo_aed_sources.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import_reports/20260912_tokyo_remaining_aed_discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Discover remaining Tokyo AED sources"
          git push
