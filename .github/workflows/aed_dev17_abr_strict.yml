name: AED dev17 strict address review

on:
  push:
    branches: [main]
    paths:
      - scripts/geocode_aed_dev17_abr_strict.py
      - scripts/geocode_aed_dev17_geolonia_strict.js
      - .github/workflows/aed_dev17_abr_strict.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aed-dev17-abr-strict
  cancel-in-progress: true

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install strict geocoder dependencies
        run: npm install --no-save @geolonia/normalize-japanese-addresses@3.1.3 csv-parse@5 xlsx@0.18.5 iconv-lite@0.6.3
      - name: Geocode address-only official AED rows
        run: node scripts/geocode_aed_dev17_geolonia_strict.js
      - name: Commit review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev17_geolonia_strict
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Review three AED datasets with strict ABR"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
