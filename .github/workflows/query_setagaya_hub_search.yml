name: Query Setagaya AED Hub Search

on:
  push:
    paths:
      - "scripts/query_setagaya_hub_search.py"
      - ".github/workflows/query_setagaya_hub_search.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/query_setagaya_hub_search.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import_reports/20260912_setagaya_hub_search_api.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Query Setagaya AED Hub search"
          git fetch origin main
          git rebase origin/main
          git push
