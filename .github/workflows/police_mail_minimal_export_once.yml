name: MAP Police Official Mail Public Form - Minimal Export Schema Only
on:
  push:
    branches: [feat/map-police-opendata-vnext-nonprod-20261031]
    paths:
      - '.github/workflows/police_mail_minimal_export_once.yml'
      - 'addons/police_official_vnext/mail_form_minimal_export.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-public-day-schema-only:
    if: github.ref == 'refs/heads/feat/map-police-opendata-vnext-nonprod-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check read-only export safety gates offline
        working-directory: addons/police_official_vnext
        run: python -m unittest discover -s tests -p 'test_mail_form_minimal_export.py' -v
      - name: Install pinned public-browser dependency (no credentials)
        run: python -m pip install --disable-pip-version-check --no-input playwright==1.56.0
      - name: One day public CSV form, schema ONLY (single conditional POST)
        working-directory: addons/police_official_vnext
        run: python mail_form_minimal_export.py
