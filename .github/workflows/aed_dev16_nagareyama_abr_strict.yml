name: AED dev16 Nagareyama strict ABR

on:
  push:
    branches: [main]
    paths:
      - scripts/geocode_nagareyama_dev16_abrg_strict.py
      - .github/workflows/aed_dev16_nagareyama_abr_strict.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ABR geocoder
        run: npm install -g @digital-go-jp/abr-geocoder@2.3.1
      - name: Strict geocode Nagareyama AED list
        run: python scripts/geocode_nagareyama_dev16_abrg_strict.py
      - name: Commit review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev16_abr_strict
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Review Nagareyama AED addresses with strict ABR"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
