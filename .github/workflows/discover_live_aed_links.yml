name: Discover Live AED Links

on:
  push:
    paths:
      - "scripts/discover_live_aed_links.py"
      - ".github/workflows/discover_live_aed_links.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/discover_live_aed_links.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import_reports/20260912_remaining_live_links.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Discover live remaining AED source links"
          git push
