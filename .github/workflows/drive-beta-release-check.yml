name: DRIVE Tokyo Release Candidate
on:
  push:
    branches: [preview/dev38-drive-rc-20261004]
  pull_request:
    branches: [main]
    paths: ['drive-beta/**', 'data/drive/tokyo-*', 'scripts/*tokyo*', 'scripts/drive_*', 'tests/drive*', 'package.json', 'package-lock.json', '.github/workflows/drive-beta-release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drive-tokyo-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and offline candidate contracts
        run: npm run check:drive && npm run test:drive
      - name: Offline snapshot reproduction
        run: |
          npm run build:drive
          git diff --exit-code -- drive-beta/data/
      - name: Preserve main hardening
        run: npm test
