name: Machimamo video production v2 CI

on:
  push:
    branches:
      - feature/machimamo-video-production-v2
    paths:
      - "tools/video-production-v2/**"
      - ".github/workflows/machimamo-video-production-v2-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/video-production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Render deterministic sample
        run: npm run render:short -- samples/typhoon25.json out/ci-short.mp4
      - name: Technical QC
        run: npx tsx scripts/qc.ts out/ci-short.mp4 samples/typhoon25.json
      - name: Upload CI evidence only
        uses: actions/upload-artifact@v4
        with:
          name: machimamo-video-v2-ci-evidence
          path: tools/video-production-v2/out/ci-short.mp4
          retention-days: 1
