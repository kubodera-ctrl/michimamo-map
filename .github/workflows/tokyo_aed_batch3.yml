name: Import Tokyo AED Batch 3

on:
  push:
    paths:
      - "data/tokyo_aed_batch3_sources.json"
      - "scripts/import_aed_open_data.py"
      - ".github/workflows/tokyo_aed_batch3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Tokyo AED batch 3 seed
        run: |
          python scripts/import_aed_open_data.py \
            --manifest data/tokyo_aed_batch3_sources.json \
            --output-sql supabase/migrations/20260912_tokyo_aed_batch3.sql \
            --output-report data/import_reports/20260912_tokyo_aed_batch3.json
      - name: Commit generated seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260912_tokyo_aed_batch3.sql data/import_reports/20260912_tokyo_aed_batch3.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate Tokyo AED batch 3 seed"
          git push
