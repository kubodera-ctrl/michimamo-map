name: Import Suginami AED

on:
  push:
    paths:
      - "data/suginami_aed_source.json"
      - ".github/workflows/suginami_aed_import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Suginami AED seed
        run: |
          python scripts/import_aed_open_data.py \
            --manifest data/suginami_aed_source.json \
            --output-sql supabase/migrations/20260912_suginami_aed_seed.sql \
            --output-report data/import_reports/20260912_suginami_aed.json

      - name: Commit generated seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260912_suginami_aed_seed.sql data/import_reports/20260912_suginami_aed.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate Suginami AED seed"
          git push
