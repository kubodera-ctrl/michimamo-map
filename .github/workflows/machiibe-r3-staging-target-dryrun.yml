# Reuses previously saved 2026-10-31 workerd-PASS generated code; no build or Cloudflare writes.
name: Machiibe R3 Staging Target Official Compile Only
on:
  push:
    branches:
      - 'chore/machiibe-r3-auth-dryrun-20261031'
    paths:
      - '.github/workflows/machiibe-r3-staging-target-dryrun.yml'
permissions:
  actions: read
  contents: read
jobs:
  target-dryrun:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
    steps:
      - name: Fixed Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Retrieve exact previous local-workerd PASS artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 41178678058
          name: machiibe-r3-auth-workerd-41178678058
          github-token: ${{ github.token }}
          path: source
      - name: Exact-SHA archive reuse and target-specific config
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v22.23.2'
          echo '873bd109fa1071426f8d8f40c23d0271d0695b021dc1f4b26501845377a1437d  source/r3-auth-nonprod-build-TEST-ONLY.tgz' | sha256sum -c -
          mkdir stage
          tar -xzf source/r3-auth-nonprod-build-TEST-ONLY.tgz -C stage
          test -f stage/.open-next/auth-entry.mjs
          test -f stage/.open-next/worker.js
          test -d stage/.open-next/assets
          test ! -f stage/.env
          test ! -f stage/.dev.vars
          printf '%s' '' | base64 -d > stage/wrangler.r3-hosted-staging.jsonc
          echo 'a51f92e645d72b63a63f60021b253cd977b70275869b76b861eab72e0b2d56a7  stage/wrangler.r3-hosted-staging.jsonc' | sha256sum -c -
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('stage/wrangler.r3-hosted-staging.jsonc'));if(c.name!=='machiibe-r3-auth-stage-20261031'||c.assets.run_worker_first!==true||c.vars.NEXT_PUBLIC_ALLOW_INDEXING!=='false'||c.account_id!=='78228c20b574fd90bda172c5cb226802')process.exit(3)"
          echo 'SOURCE_SHA_AND_STAGING_CONFIG_PASS_NO_SECRET_NO_DEPLOY'
      - name: Official target-config Wrangler compile only
        working-directory: stage
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=wrangler@4.151.1 -- wrangler deploy --dry-run --config wrangler.r3-hosted-staging.jsonc --outdir ./target-dryrun-bundle > target-dryrun.log 2>&1
          grep -F -- '--dry-run: exiting now.' target-dryrun.log
          test -d target-dryrun-bundle
          test "$(find target-dryrun-bundle -type f | wc -l)" -gt 0
          echo 'STAGING_TARGET_WRANGLER_OFFICIAL_DRYRUN_PASS; HOSTED_AND_FREE_CAPACITY_NOT_TESTED'
      - name: Preserve target config and log (no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: machiibe-r3-target-config-${{ github.run_id }}
          path: |
            stage/wrangler.r3-hosted-staging.jsonc
            stage/target-dryrun.log
          if-no-files-found: error
          retention-days: 14
