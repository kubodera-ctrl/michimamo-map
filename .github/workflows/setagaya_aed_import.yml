name: Import Setagaya AED

on:
  push:
    paths:
      - "data/setagaya_aed_arcgis.json"
      - "scripts/import_aed_arcgis.py"
      - ".github/workflows/setagaya_aed_import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build Setagaya AED seed
        run: |
          python scripts/import_aed_arcgis.py             --manifest data/setagaya_aed_arcgis.json             --output-sql supabase/migrations/20260912_setagaya_aed_seed.sql             --output-report data/import_reports/20260912_setagaya_aed.json
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260912_setagaya_aed_seed.sql data/import_reports/20260912_setagaya_aed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Setagaya AED seed"
          git push
