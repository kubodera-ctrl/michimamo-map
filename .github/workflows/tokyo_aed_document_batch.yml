name: Import Tokyo AED Document Batch

on:
  push:
    paths:
      - "data/tokyo_aed_document_batch.json"
      - "scripts/import_aed_documents_abrg.py"
      - "scripts/geocode_with_geolonia.mjs"
      - ".github/workflows/tokyo_aed_document_batch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pdfplumber
          npm install @geolonia/normalize-japanese-addresses@3.1.3
      - name: Generate seed
        run: |
          python scripts/import_aed_documents_abrg.py             --manifest data/tokyo_aed_document_batch.json             --output-sql supabase/migrations/20260912_tokyo_aed_document_batch.sql             --output-report data/import_reports/20260912_tokyo_aed_document_batch.json
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260912_tokyo_aed_document_batch.sql data/import_reports/20260912_tokyo_aed_document_batch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Tokyo AED document batch seed"
          git push
