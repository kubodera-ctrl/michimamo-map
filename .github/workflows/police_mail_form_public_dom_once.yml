name: MAP Police Mail Open DATA public form DOM diagnostic
on:
  push:
    branches: [feat/map-police-opendata-vnext-nonprod-20261031]
    paths:
      - '.github/workflows/police_mail_form_public_dom_once.yml'
      - 'addons/police_official_vnext/mail_form_dom_probe.py'
      - 'addons/police_official_vnext/tests/test_mail_form_dom_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-form-read-only:
    if: github.ref == 'refs/heads/feat/map-police-opendata-vnext-nonprod-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm zero-network form parser invariants
        working-directory: addons/police_official_vnext
        run: python -m unittest discover -s tests -p 'test_mail_form_dom_probe.py' -v
      - name: Install pinned public-browser diagnostic dependency
        run: python -m pip install --disable-pip-version-check --no-input playwright==1.56.0
      - name: Read public official form using Chrome GET-only (no submit or download)
        working-directory: addons/police_official_vnext
        run: python mail_form_dom_probe.py
