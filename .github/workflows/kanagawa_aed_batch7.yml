name: Import Kanagawa AED Batch 7

on:
  push:
    paths:
      - "data/kanagawa_aed_batch7_sources.json"
      - "data/kanagawa_zama_aed_validated_20260312.csv"
      - ".github/workflows/kanagawa_aed_batch7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Kanagawa AED batch 7 seed
        run: |
          python scripts/import_aed_open_data.py \
            --manifest data/kanagawa_aed_batch7_sources.json \
            --output-sql supabase/migrations/20260912_kanagawa_aed_batch7.sql \
            --output-report data/import_reports/20260912_kanagawa_aed_batch7.json
      - name: Commit generated seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260912_kanagawa_aed_batch7.sql data/import_reports/20260912_kanagawa_aed_batch7.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate Kanagawa AED batch 7 seed"
          git push
