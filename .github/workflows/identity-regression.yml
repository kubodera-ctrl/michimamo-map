name: Identity Regression Check

on:
  push:
    branches:
      - feat/dev38-identity-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Show exact SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "event_sha=${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full npm test
        run: npm test
