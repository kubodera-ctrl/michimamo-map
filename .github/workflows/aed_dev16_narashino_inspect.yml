name: AED dev16 Narashino XLS inspect

on:
  push:
    branches: [main]
    paths:
      - scripts/inspect_narashino_aed_xls.py
      - .github/workflows/aed_dev16_narashino_inspect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XLS parser
        run: python -m pip install xlrd==2.0.2
      - name: Download and inspect Narashino AED XLS
        run: python scripts/inspect_narashino_aed_xls.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev16_narashino
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect Narashino official AED XLS data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
