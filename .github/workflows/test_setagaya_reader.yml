name: Test Setagaya AED Reader Cache

on:
  push:
    paths:
      - ".github/workflows/test_setagaya_reader.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Setagaya AED through reader cache
        run: |
          curl -L --max-time 90 -sS "https://r.jina.ai/https://www.city.setagaya.lg.jp/documents/3038/aedichiran.pdf" -o /tmp/setagaya.txt
          echo "bytes=$(wc -c </tmp/setagaya.txt)"
          head -30 /tmp/setagaya.txt
          grep -n "世田谷区役所東棟" /tmp/setagaya.txt | head
