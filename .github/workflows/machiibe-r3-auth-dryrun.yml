# Isolated code-only CI. Created with user GO; no Cloudflare deployment, credentials, or production changes.
name: Machiibe R3 Auth Wrapper Official Compile Only
on:
  push:
    branches:
      - 'chore/machiibe-r3-auth-dryrun-20261031'
    paths:
      - '.github/workflows/machiibe-r3-auth-dryrun.yml'
permissions:
  contents: read
concurrency:
  group: machiibe-r3-auth-dryrun-${{ github.ref }}
  cancel-in-progress: false
jobs:
  official-dry-run:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
    steps:
      - name: Checkout exact PR43 based branch
        uses: actions/checkout@v4
      - name: Set up fixed Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify fixed base and pinned versions
        shell: bash
        run: |
          test '$(git rev-parse HEAD^)' = '5e0497206b4fcd06a82a931ca4b191b91ad0e45f'
          node --version | grep '^v22\.23\.2$'
          node -e "const p=require('./event-site/package.json'); if(p.dependencies.next!=='16.4.2'||p.devDependencies['@opennextjs/cloudflare']!=='1.20.13'||p.devDependencies.wrangler!=='4.151.1')process.exit(3)"
      - name: Install existing pinned event-site packages
        working-directory: event-site
        run: npm install --no-audit --no-fund
      - name: Build PR43 Next16 OpenNext (no release)
        working-directory: event-site
        run: npm run cf:build
      - name: Prepare isolated auth wrapper + config, never deploy
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, json, re
          base=Path('event-site')
          a=base/'.open-next'
          assert (a/'worker.js').is_file(), 'PR43 OpenNext output missing; stop'
          assert (a/'assets').is_dir(), 'PR43 ASSETS missing; stop'
          wrapper=base64.b64decode('')
          expected='2de2a1f479c6c9162b9fb7ba8d7b4e2dde22201804099519b7c0a5eb5cd057dc'
          assert hashlib.sha256(wrapper).hexdigest()==expected,'Wrapper source mismatch STOP'
          assert b'BETA_PASSWORD' in wrapper and b'Cache-Control' in wrapper
          (a/'beta-pages-wrapper.mjs').write_bytes(wrapper)
          (a/'auth-entry.mjs').write_text("import applicationWorker from './worker.js';\nimport { betaPagesWrapperFetch } from './beta-pages-wrapper.mjs';\nexport { DOQueueHandler, DOShardedTagCache, BucketCachePurge } from './worker.js';\nexport default { fetch(request, env, ctx) { return betaPagesWrapperFetch(request,env,ctx,applicationWorker); } };\n",encoding='utf-8')
          config={
            'name':'machiibe-r3-ci-dryrun-only',
            'main':'.open-next/auth-entry.mjs',
            'compatibility_date':'2026-09-19',
            'compatibility_flags':['nodejs_compat'],
            'assets':{'directory':'.open-next/assets','binding':'ASSETS','run_worker_first':True},
            'vars':{'NEXT_PUBLIC_ALLOW_INDEXING':'false'},
            'observability':{'enabled':False},
            'preview_urls':False
          }
          assert all(x not in config for x in ('routes','route','triggers','queues','r2_buckets','account_id','env'))
          (base/'wrangler.auth-local-dryrun.jsonc').write_text(json.dumps(config,indent=2)+'\n',encoding='utf-8')
          init=a/'cloudflare'/'init.js'
          if init.exists():
            txt=init.read_text(encoding='utf-8')
            if '__ASSETS_RUN_WORKER_FIRST__: false' in txt:
              print('GENERATED_INTERNAL_FLAG_FALSE (expected mismatch preserved; Hosted routing not proven)')
          print('STAGING_SOURCE_SHA_MATCH',expected)
          print('AUTH_FIRST_ROUTING_IN_WRANGLER_CONFIG',config['assets']['run_worker_first'])
          print('NO_DEPLOYMENT_NO_SECRETS')
          PYCODE
      - name: Targeted wrapper boundary smoke (synthetic only)
        working-directory: event-site
        shell: bash
        run: |
          node --input-type=module <<'JSCODE'
          import assert from 'node:assert/strict';
          import {betaPagesWrapperFetch} from './.open-next/beta-pages-wrapper.mjs';
          const password = 'syntheticCIpasswordONLY1234';
          const auth = 'Basic '+btoa('beta:'+password);
          let appCalls=0,assetCalls=0;
          const app={fetch:async()=>{appCalls++;return new Response('HTML',{status:200,headers:{'Content-Type':'text/html'}})}};
          const env={BETA_PASSWORD:password,ASSETS:{fetch:async(request)=>{assetCalls++;return new URL(request.url).pathname.startsWith('/_next/static/')?new Response('CSS',{status:200}):new Response('missing',{status:404})}}};
          const req=(path,authorization)=>new Request('https://machiibe-r3.invalid'+path,{headers:authorization?{Authorization:authorization}:{}});
          let r=await betaPagesWrapperFetch(req('/'),{}, {},app);
          assert.equal(r.status,503);assert.equal(appCalls,0);assert.equal(assetCalls,0);
          r=await betaPagesWrapperFetch(req('/'),env,{},app);
          assert.equal(r.status,401);assert.equal(appCalls,0);assert.equal(assetCalls,0);
          r=await betaPagesWrapperFetch(req('/_next/static/ci.css','Basic incorrect'),env,{},app);
          assert.equal(r.status,401);assert.equal(appCalls,0);assert.equal(assetCalls,0);
          r=await betaPagesWrapperFetch(req('/_next/static/ci.css',auth),env,{},app);
          assert.equal(r.status,200);assert.equal(await r.text(),'CSS');assert.equal(appCalls,0);assert.equal(assetCalls,1);
          assert.match(r.headers.get('Cache-Control'),/no-store/);assert.match(r.headers.get('X-Robots-Tag'),/noindex/);
          r=await betaPagesWrapperFetch(req('/saved',auth),env,{},app);
          assert.equal(r.status,200);assert.equal(await r.text(),'HTML');assert.equal(appCalls,1);assert.equal(assetCalls,2);
          console.log('WRAPPER_SOURCE_CI_TARGETED_5_CASES_PASS; HOSTED_UNVERIFIED');
          JSCODE
      - name: Wrangler 4.151.1 official dry-run, no deployment
        working-directory: event-site
        shell: bash
        run: |
          npx wrangler deploy --dry-run --config wrangler.auth-local-dryrun.jsonc --outdir ./r3-auth-dryrun-bundle
          test -d r3-auth-dryrun-bundle
          test "$(find r3-auth-dryrun-bundle -type f | wc -l)" -ge 1
          printf 'OFFICIAL_WRANGLER_DRY_RUN_PASS; bundle file count: '
          find r3-auth-dryrun-bundle -type f | wc -l
          echo 'HOSTED_AUTH_CPU_QUEUE_R2_DB: NOT_TESTED'
