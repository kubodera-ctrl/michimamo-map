name: Event Site Check

on:
  push:
    paths:
      - 'event-site/**'
      - 'supabase/migrations/*event_platform*'
      - '.github/workflows/event-site-check.yml'
  pull_request:
    paths:
      - 'event-site/**'
      - 'supabase/migrations/*event_platform*'
      - '.github/workflows/event-site-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: event-site/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
