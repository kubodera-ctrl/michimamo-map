name: Event Site Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/machimamo-events-foundation
    paths:
      - 'event-site/**'
      - 'index.html'
      - 'supabase/migrations/**'
      - 'supabase/seeds/**'
      - 'supabase/rollback/**'
      - 'supabase/tests/**'
      - 'data/machiibe/**'
      - 'docs/machiibe-**'
      - '.github/workflows/event-site-check.yml'
  pull_request:
    paths:
      - 'event-site/**'
      - 'index.html'
      - 'supabase/migrations/**'
      - 'supabase/seeds/**'
      - 'supabase/rollback/**'
      - 'supabase/tests/**'
      - 'data/machiibe/**'
      - 'docs/machiibe-**'
      - '.github/workflows/event-site-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: event-site
    steps:
      - uses: actions/checkout@v4
      - name: workers.dev full repository audit
        working-directory: .
        run: node scripts/audit-workers-dev-refs.mjs .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: event-site/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Probe Tokyo official Event API (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:probe-tokyo-event-api
      - name: Preflight reviewed CSV - Ota (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:preflight-csv -- ota-city-events-open-data
      - name: Preflight reviewed CSV - Hamamatsu (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:preflight-csv -- hamamatsu-current-events-open-data
      - name: Discover recent BODIK event CSV candidates (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:discover-bodik-events -- 180 60
      - name: Resolve rotating source resource - Nagasaki (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:resolve-resource -- bodik-nagasaki-monthly-events
      - name: Live READY dry-run - Mie (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run -- mie-pref-events-open-data
      - name: Live READY dry-run - Okazaki (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run -- bodik-okazaki-events
      - name: Live READY dry-run - Osaka (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run -- bodik-osaka-pref-events
      - name: Live READY dry-run - Kadoma (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run -- bodik-kadoma-events
      - name: Live READY dry-run - Toyonaka (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run -- bodik-toyonaka-events
      - name: Live READY dry-run - Hamamatsu (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run -- hamamatsu-current-events-open-data
      - name: Live facts-only dry-run - Kyoto Pref (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run-facts-only -- kyoto-pref-current-events
      - name: Live facts-only dry-run - Ibaraki Kasumigaura ESC (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run-facts-only -- ibaraki-kasumigaura-esc-events
      - name: Live facts-only dry-run - Kyoto Station Building (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run-facts-only -- kyoto-station-building-events
      - name: Live READY cross-source dedupe dry-run (PR #24 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 24
        continue-on-error: true
        run: npm run source:dry-run-cross-dedupe
      - name: Build
        run: npm run build
      - name: Cloudflare adapter build
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: 'false'
        run: npm run cf:build
      - name: Route smoke
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: 'false'
        run: |
          npm run start -- -p 3100 > /tmp/machiibe-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ | grep -q "まちイベ"
          curl -fsS http://127.0.0.1:3100/admin/login | grep -q "まちイベ運営画面"
          curl -fsS http://127.0.0.1:3100/privacy | grep -q "プライバシー"
          curl -fsS http://127.0.0.1:3100/robots.txt | grep -q "Disallow: /"
          curl -fsS http://127.0.0.1:3100/manifest.webmanifest | grep -q "まちイベ"
          curl -fsSI http://127.0.0.1:3100/ | tr -d '\r' | grep -qi "^x-robots-tag: noindex, nofollow, noarchive$"
      - name: SQL migration check
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role; CREATE SCHEMA auth; CREATE TABLE auth.users(id uuid primary key, created_at timestamptz default now()); CREATE TABLE public.profiles(auth_id uuid);"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260918235500_event_platform_foundation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260919011500_family_dining_overlay.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260919043000_event_platform_admin_analytics.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260923073000_event_i18n_foundation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260927062000_machiibe_operational_foundation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260928082000_machiibe_media_commit.sql
          if [ -f supabase/migrations/20260928143000_machiibe_national_ingestion_foundation.sql ]; then psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260928143000_machiibe_national_ingestion_foundation.sql; fi
      - name: SQL behavior smoke tests
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/event_platform_smoke.sql
      - name: Real event fixture smoke
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/machiibe_real_fixture_smoke.sql
      - name: Production seed smoke
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/machiibe_production_seed_smoke.sql
      - name: National search scale smoke (10k / 50k / 100k)
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/machiibe_scale_smoke.sql
      - name: Concurrent cursor query smoke
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          seq 1 8 | xargs -P8 -I{} sh -c "psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -Atqc \"select count(*) from public.search_public_events_cursor_v2(date '2026-10-01',date '2026-12-31','東京都',null,'体験',array['family','experience'],array['free','partly_free'],true,true,null,null,24);\" >/dev/null"
      - name: MAP event deep-link smoke
        working-directory: .
        run: |
          grep -q "rawEventLat" index.html
          grep -q "rawEventLng" index.html
          grep -q "isFirstLocationSet = true" index.html
