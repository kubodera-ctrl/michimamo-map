name: AED dev16 Geolonia strict review

on:
  push:
    branches: [main]
    paths:
      - scripts/geocode_chiba_dev16_geolonia_strict.js
      - .github/workflows/aed_dev16_geolonia_strict.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save @geolonia/normalize-japanese-addresses@3.1.3 csv-parse@5 xlsx@0.18.5 iconv-lite@0.6.3
      - name: Geocode strict level 8 only
        run: node scripts/geocode_chiba_dev16_geolonia_strict.js
      - name: Commit review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev16_geolonia_strict
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Review Chiba AED addresses with Geolonia level 8"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
