name: AED dev16 Yachiyo strict ABR

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aed_dev16_yachiyo_abr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install openpyxl==3.1.5
          npm install -g @digital-go-jp/abr-geocoder@2.3.1
      - name: Strict geocode Yachiyo AED
        run: python scripts/geocode_chiba_dev16_abrg_one.py --code 12221
      - name: Commit review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev16_abr_strict/12221_*
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Review Yachiyo AED with strict ABR"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
