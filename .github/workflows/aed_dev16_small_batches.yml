name: AED dev16 small guarded batches

on:
  push:
    branches: [main]
    paths:
      - scripts/split_aed_dev16_priority_sql.py
      - .github/workflows/aed_dev16_small_batches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build small guarded publication SQL
        run: python scripts/split_aed_dev16_priority_sql.py
      - name: Commit generated SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aed_dev16_small
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build dev16 small guarded AED batches"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
