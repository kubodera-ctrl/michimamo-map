name: Beta Security DB Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/20260929130000_beta_edge_rate_limit.sql'
      - 'supabase/migrations/20260929130500_safe_profile_ranking.sql'
      - 'supabase/tests/beta_security_prep_transaction.sql'
      - '.github/workflows/beta-security-db-check.yml'

permissions:
  contents: read

jobs:
  security-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Show exact SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "event_sha=${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Prepare Supabase-compatible auth stubs
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;

          create schema auth;

          create or replace function auth.role()
          returns text
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.role', true), '')
          $$;

          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          create table public.profiles (
            id uuid primary key,
            auth_id uuid,
            name text,
            avatar text,
            point integer
          );
          SQL

      - name: Apply dev38 security migrations
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1             -f supabase/migrations/20260929130000_beta_edge_rate_limit.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1             -f supabase/migrations/20260929130500_safe_profile_ranking.sql

      - name: Run behavior transaction
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1             -f supabase/tests/beta_security_prep_transaction.sql
