<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>まちまも DRIVE β</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/drive-beta/drive.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">
  <div id="map" aria-label="まちまも DRIVE β 地図"></div>
  <div class="topbar">
    <div class="brand"><strong>🚗 まちまも DRIVE β</strong><span>運転中の安全情報に特化した試作</span></div>
    <div class="clock" id="jstClock">--:--</div>
  </div>
  <div class="controls">
    <button class="chip" id="enforcementToggle" aria-pressed="true">🚓 取締重点</button>
    <button class="chip" id="accidentToggle" aria-pressed="false">⚠️ 事故多発 OFF</button>
    <button class="chip" id="scheduleToggle" aria-pressed="false" aria-expanded="false">📅 公開取締予定</button>
  </div>
  <div class="schedule-day-banner" id="scheduleDayBanner" role="status" aria-live="polite" hidden>
    <strong id="scheduleDayTitle"></strong>
    <span id="scheduleDayCopy"></span>
  </div>
  <section class="schedule-panel" id="schedulePanel" aria-label="警視庁 公開交通取締り" hidden>
    <div class="schedule-head">
      <div>
        <strong>📅 警視庁 公開交通取締り</strong>
        <span id="schedulePeriod">読み込み中</span>
      </div>
      <button id="scheduleClose" class="schedule-close" aria-label="公開取締予定を閉じる">×</button>
    </div>
    <div class="schedule-list" id="scheduleList"></div>
    <div class="schedule-foot">
      公開された月間方針・一斉日です。現在その場所で取締りを実施中であることを示しません。
      <a id="scheduleSource" href="#" target="_blank" rel="noopener noreferrer">警視庁の出典</a>
    </div>
  </section>
  <div class="legend" aria-hidden="true">
    <div><i class="red"></i>現在の重点時間帯</div>
    <div><i class="orange"></i>重点区間（時間外）</div>
    <div><i class="purple"></i>事故多発エリア</div>
  </div>
  <button class="location-btn" id="locationBtn" aria-label="現在地へ移動">◎</button>
  <div class="alert-card" id="proximityAlert" role="status" aria-live="polite">
    <button class="alert-close" id="alertClose" aria-label="閉じる">×</button>
    <strong id="alertTitle">この先、速度取締重点区間です</strong>
    <span id="alertBody"></span>
  </div>
  <div class="panel">
    <div class="panel-row">
      <div class="state-dot" id="stateDot"></div>
      <div>
        <div class="panel-title" id="statusTitle">公式の重点時間帯を確認しています</div>
        <div class="panel-copy" id="statusCopy">実際に現場で取締り・検問を実施中であることを示す表示ではありません。</div>
      </div>
    </div>
    <div class="beta-note">β：東京湾岸署の現行公式PDF 9路線を収録。道路線形は検証済み区間から順次表示します。</div>
  </div>
</div>
<script src="/drive-beta/enforcement-zones.js"></script>
<script src="/drive-beta/app.js"></script>
<!-- drive-beta-ui-v2 -->
</body>
</html>
